name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  cicd:
    uses: ckoliber/dotfiles/.github/workflows/mise.yml@main
    permissions:
      contents: write
      packages: write
    with:
      fetch-depth: 0
      script: |
        mise run docker:lint
        mise run docker:login
        mise run docker:build --version "$(mise run release:cliff --dry-run)"
        if [ "$GITHUB_EVENT_NAME" = push ]; then mise run release:cliff; fi
